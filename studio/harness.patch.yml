[
  {
    "id": "llm-pi-ai",
    "config": {
      "providers": {
        "gpt-ge": {
          "displayName": "GPT.GE",
          "apiKeyEnv": "GPT_GE_API_KEY",
          "api": "openai-completions",
          "baseURL": "https://api.gpt.ge/v1",
          "models": [
            {
              "id": "gpt-6.1-sol",
              "reasoningEfforts": {
                "off": null,
                "high": "high"
              }
            },
            {
              "id": "gpt-6-sol",
              "reasoningEfforts": {
                "off": null,
                "high": "high"
              }
            }
          ],
          "retryPolicy": {
            "mode": "normal",
            "maxRetries": 3,
            "retryableCodes": [
              "EMPTY_RESPONSE",
              "RATE_LIMIT",
              "SERVER",
              "TIMEOUT",
              "TRANSPORT"
            ],
            "backoff": {
              "initialDelayMs": 120000,
              "maxDelayMs": 300000,
              "jitterRatio": 0
            }
          }
        },
        "gpt-ge-default": {
          "displayName": "GPT.GE · default",
